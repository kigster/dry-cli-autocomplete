name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '4.0.6'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The suite validates every generated script with the shell that has to
      # read it. ubuntu-latest ships bash but not zsh, and spec/support/
      # shell_helpers.rb turns a missing shell into a failure when CI is set,
      # so that those checks cannot quietly stop running.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake

  # examples/ is its own bundle: it loads this gem from ../ and adds the
  # gems mycli needs. Its suite stubs the network, so it needs nothing else.
  example:
    runs-on: ubuntu-latest
    name: examples/ on Ruby 4.0.6
    defaults:
      run:
        working-directory: examples

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
          working-directory: examples
      - name: Run the example suite
        run: bundle exec rspec
