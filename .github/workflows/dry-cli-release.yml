name: Latest dry-cli

# Runs the suite against the newest dry-cli on rubygems, whatever Gemfile.lock
# pins, so a dry-cli release that breaks this gem shows up within a week.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec:
    runs-on: ubuntu-latest
    name: Ruby 4.0.6, latest dry-cli

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The suite checks every generated script with the shell that reads it,
      # and ubuntu-latest has no zsh. See the same step in main.yml.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      # No bundler-cache: it freezes the bundle, and this job has to update it.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'

      - name: Take the latest dry-cli release
        run: bundle update dry-cli && bundle info dry-cli

      - name: Run the specs
        run: bundle exec rake
